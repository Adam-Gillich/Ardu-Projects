; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Each sketch lives in its own folder under src/ and has its own env.
; Pick one with the env switcher in the status bar, or: pio run -e pwm -t upload

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600

[env:villogo]
build_src_filter = +<villogo/>

[env:pwm]
build_src_filter = +<pwm/>

[env:adc]
build_src_filter = +<adc/>

[env:lcd]
build_src_filter = +<lcd/>
lib_deps = adafruit/Adafruit LiquidCrystal

[env:servo]
build_src_filter = +<servo/>
lib_deps =
    adafruit/Adafruit LiquidCrystal
    arduino-libraries/Servo
